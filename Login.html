<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <script
      src="https://kit.fontawesome.com/45fb778009.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <form>
      <div class="container-cards-login">
        <div class="cards-login">
          <img src="pdmlogo.png" alt="Logo" class="login-image" />
          <h2>
            PAMBAYANG DALUBHASAAN<br /><span class="highlight-txt"
              >NG MARILAO</span
            >
          </h2>
          <h2 class="create-txt-login">WELCOME BACK</h2>
          <p class="txt-login">Please log in to your account</p>
          <div class="input-container-login">
            <p>Email Address:</p>
            <div class="email_icon_login">
              <i class="fa-regular fa-envelope fa-xl icon-login"></i>
              <input
                type="email"
                name="email"
                class="email-container-login"
                placeholder="Enter your Mail"
              />
            </div><br>
            <p>Password:</p>
            <div class="pwd_icon_login">
              <i class="fa-solid fa-lock fa-xl icon-login"></i>
              <input
                type="password"
                name="pwd"
                class="pwd-container-login"
                placeholder="Enter your Password"
              />
            </div>
            <div class="forgot-pwd-container-login">
                <button>Forgot Password?</button>
            </div>
            <button class="signup-btn-login">LOGIN</button>
          </div>
          <div class="login-section">
            <hr class="horizontal" />
            <p class="login-text">
              Don't have an account?
              <a href="RegistrationForm.html" target="_self" class="login-link">Signup</a>
            </p>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
