<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My account | PDM</title>
    <script
      src="https://kit.fontawesome.com/45fb778009.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container-cards-login">
      <div class="account-card">
        <img src="mypic.png" alt="Profile photo" class="profile-photo" />
        <h2 class="account-name">Loading…</h2>
        <p class="account-email"></p>
        <p class="account-note">
          You are signed in to Pambayang Dalubhasaan ng Marilao. Closing this
          tab ends the session.
        </p>
        <button class="logout-btn" type="button">LOG OUT</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
